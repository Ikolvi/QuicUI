name: quicui_cli
description: QuicUI command-line interface for managing code push patches. Build, release and patch Flutter apps with OTA updates.
version: 1.0.2
homepage: https://github.com/Ikolvi/QuicUI
repository: https://github.com/Ikolvi/QuicUI
issue_tracker: https://github.com/Ikolvi/quicui-cli/issues
topics:
  - cli
  - code-push
  - flutter
  - ota-updates

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.4.0
  cli_util: ^0.4.0
  meta: ^1.9.0
  http: ^1.1.0
  path: ^1.8.0
  yaml: ^3.1.0
  crypto: ^3.0.2
  dart_style: ^2.3.0
  archive: ^3.6.1
  quicui_compiler: ^1.0.0
  quicui_linker: ^1.0.0

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0

executables:
  quicui: quicui

name: quicui
description: Over-the-air (OTA) updates for Flutter apps. Download and install code updates instantly with QuicUI Code Push system.
version: 2.0.8
homepage: https://github.com/Ikolvi/QuicUICodepush
repository: https://github.com/Ikolvi/QuicUICodepush
issue_tracker: https://github.com/Ikolvi/QuicUICodepush/issues
documentation: https://github.com/Ikolvi/QuicUICodepush/tree/main/docs

environment:
  sdk: ^3.0.0
  flutter: ">=1.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  crypto: ^3.0.2
  path_provider: ^2.1.0
  path: ^1.8.0
  archive: ^3.4.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0
  mocktail: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.quicui.codepush
        pluginClass: QuicuiCodePushClientPlugin
      ios:
        pluginClass: QuicUICodePushPlugin

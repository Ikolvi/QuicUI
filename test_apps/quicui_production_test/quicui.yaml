# QuicUI Code Push Configuration
# Generated by: quicui init

# Backend server configuration
server:
  url: "https://pcaxvanjhtfaeimflgfk.supabase.co/functions/v1"
  # API key can be set via QUICUI_API_KEY environment variable
  # api_key: "your-api-key-here"

# Application configuration
app:
  id: "com.example.quicui_production_test"
  name: "A new Flutter project."

# Version management
version:
  current: "1.0.0"
  auto_increment: true
  format: "semantic"

# Build configuration
build:
  flutter_project: "."
  output_dir: ".quicui"
  apk_path: "build/app/outputs/flutter-apk/app-release.apk"
  
  # Target architectures for patch generation
  architectures:
    - arm64-v8a
    # - armeabi-v7a  # Uncomment for 32-bit ARM support

# Patch configuration
patch:
  compression: xz  # Best compression for minimal download size
  skip_if_identical: true
  keep_old_patches: 3

# Upload configuration
upload:
  auto_upload: true
  retry_count: 3
  timeout: 60

# Advanced options
advanced:
  cache_base_snapshots: true
  parallel_generation: true
  verbose: false
  dry_run: false

# Notification configuration (optional)
notifications:
  enabled: false
  webhook_url: null
  notify_on_success: true
  notify_on_failure: true
